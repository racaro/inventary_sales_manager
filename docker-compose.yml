services:
  sembra-sales-manager:
    build: .
    container_name: sembra2023-sales-manager
    ports:
      - "5901:5901"  # VNC port
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config:/app/config
    environment:
      - DISPLAY=:1
      - VNC_PORT=5901
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python3 main.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  backups:
  config:
