# Ruff configuration for Stock Manager
target-version = "py311"
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".ruff_cache",
    "build",
    "dist",
]

# Enable rules
select = ["F"]
ignore = ["E501"]

# Fix settings
fixable = ["ALL"]
unfixable = []

[per-file-ignores]
"__init__.py" = ["F401"]
